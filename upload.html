<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Isolation Processor</title>
  <style>
    body {
      background: #0b1329;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    #status {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      margin: 15px 0;
    }
    .preview-box {
      display: inline-block;
      margin: 20px;
      background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 20px 20px;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 10px;
    }
    canvas {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Satellite Alpha Extraction</h1>
  <div id="status">Loading image...</div>
  <div class="preview-box">
    <canvas id="outputCanvas"></canvas>
  </div>

  <script>
    async function process() {
      const status = document.getElementById('status');
      status.innerText = 'Loading satellite_isolated_black.jpg...';
      
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = '/satellite_isolated_black.jpg?' + Date.now();
      
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });
      
      status.innerText = 'Image loaded (' + img.width + 'x' + img.height + '). Processing alpha mask...';
      
      const w = img.width;
      const h = img.height;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w;
      tempCanvas.height = h;
      const ctx = tempCanvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      
      // Flood-fill / Connected Component from image borders
      // Any black background connected to border will be made transparent.
      const isBg = new Uint8Array(w * h);
      const queue = new Int32Array(w * h);
      let qHead = 0;
      let qTail = 0;
      
      // Threshold for black background (JPEG noise in pure black is usually < 12)
      const THRESH = 18;
      
      function checkAndPush(x, y) {
        if (x < 0 || x >= w || y < 0 || y >= h) return;
        const idx = y * w + x;
        if (isBg[idx]) return;
        
        const pi = idx * 4;
        const r = data[pi];
        const g = data[pi + 1];
        const b = data[pi + 2];
        
        if (r <= THRESH && g <= THRESH && b <= THRESH) {
          isBg[idx] = 1;
          queue[qTail++] = idx;
        }
      }
      
      // Seed along top, bottom, left, right edges
      for (let x = 0; x < w; x++) {
        checkAndPush(x, 0);
        checkAndPush(x, h - 1);
      }
      for (let y = 0; y < h; y++) {
        checkAndPush(0, y);
        checkAndPush(w - 1, y);
      }
      
      // Flood fill loop
      while (qHead < qTail) {
        const idx = queue[qHead++];
        const x = idx % w;
        const y = (idx / w) | 0;
        
        checkAndPush(x + 1, y);
        checkAndPush(x - 1, y);
        checkAndPush(x, y + 1);
        checkAndPush(x, y - 1);
      }
      
      // Find bounding box of foreground (non-bg)
      let minX = w, maxX = 0, minY = h, maxY = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          if (!isBg[idx]) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      
      status.innerText = `Foreground detected: [${minX}, ${minY}] to [${maxX}, ${maxY}] (size: ${maxX - minX + 1}x${maxY - minY + 1}). Applying anti-aliasing...`;
      
      // Apply transparency and anti-aliased edge feathering
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const pi = idx * 4;
          if (isBg[idx]) {
            data[pi + 3] = 0; // Fully transparent
          } else {
            // Check if neighboring any bg pixel for feathering
            const r = data[pi];
            const g = data[pi + 1];
            const b = data[pi + 2];
            const brightness = Math.max(r, g, b);
            
            let bgNeighbors = 0;
            if (x > 0 && isBg[idx - 1]) bgNeighbors++;
            if (x < w - 1 && isBg[idx + 1]) bgNeighbors++;
            if (y > 0 && isBg[idx - w]) bgNeighbors++;
            if (y < h - 1 && isBg[idx + w]) bgNeighbors++;
            
            if (bgNeighbors > 0 && brightness < 35) {
              data[pi + 3] = Math.min(255, Math.max(0, Math.round((brightness / 35) * 255)));
            } else {
              data[pi + 3] = 255;
            }
          }
        }
      }
      
      ctx.putImageData(imgData, 0, 0);
      
      // Add small margin around bounding box
      const pad = 4;
      const cropX = Math.max(0, minX - pad);
      const cropY = Math.max(0, minY - pad);
      const cropW = Math.min(w - cropX, (maxX - minX + 1) + pad * 2);
      const cropH = Math.min(h - cropY, (maxY - minY + 1) + pad * 2);
      
      const outCanvas = document.getElementById('outputCanvas');
      outCanvas.width = cropW;
      outCanvas.height = cropH;
      const outCtx = outCanvas.getContext('2d');
      outCtx.drawImage(tempCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      status.innerText = `Exporting cropped PNG (${cropW}x${cropH})...`;
      const pngData = outCanvas.toDataURL('image/png');
      
      const res = await fetch('/api/save-transparent-satellite', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: pngData
      });
      const result = await res.json();
      
      if (result.success) {
        status.innerText = `SUCCESS! Saved satellite_transparent.png (${result.size} bytes). Dimensions: ${cropW}x${cropH}`;
        status.style.color = '#10b981';
      } else {
        status.innerText = 'Save error: ' + JSON.stringify(result);
        status.style.color = '#ef4444';
      }
    }
    
    process().catch(e => {
      document.getElementById('status').innerText = 'Error: ' + e.message;
    });
  </script>
</body>
</html>
